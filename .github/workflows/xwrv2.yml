name: Render MJX9
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_work: ${{ steps.discover.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdown
        run: pip install gdown --break-system-packages
      - name: Download MJX9 images folder from Drive
        run: |
          mkdir -p /tmp/mjx9discover
          gdown --folder "https://drive.google.com/drive/folders/1sXwstU6lFL2G6msCSYife8GFt_YEmwN4" -O /tmp/mjx9discover
      - name: Discover all images
        id: discover
        run: |
          python3 -c "
          import json, os, sys
          from pathlib import Path
          IMAGES_DIR = Path('/tmp/mjx9discover')
          all_images = sorted(
              p for p in IMAGES_DIR.rglob('*')
              if p.suffix.lower() in ('.png', '.jpg', '.jpeg')
          )
          if not all_images:
              print('ERROR: no images found.', file=sys.stderr)
              sys.exit(1)
          print(f'Total images: {len(all_images)}')
          for p in all_images:
              print(f'  - {p.name}')
          matrix = {'include': [{'image_name': p.name} for p in all_images]}
          has_work = 'true' if all_images else 'false'
          github_output = os.environ.get('GITHUB_OUTPUT')
          with open(github_output, 'a') as f:
              f.write(f'matrix={json.dumps(matrix)}\n')
              f.write(f'has_work={has_work}\n')
          "
  render:
    needs: discover
    if: needs.discover.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg --fix-missing
          ffmpeg -version
          ffprobe -version
          pip install gdown --break-system-packages
      - name: Verify render.py is present
        run: |
          echo "Repo root contents:"
          ls -la
          if [ ! -f render.py ]; then
            echo "ERROR: render.py not found in repo root. Commit it at the top level, not inside .github/workflows."
            exit 1
          fi
      - name: Run render
        id: render
        env:
          TARGET_IMAGE_NAME: ${{ matrix.image_name }}
        run: python3 render.py
      - name: Warn if small
        if: steps.render.outputs.under_minimum == 'true'
        run: echo "Note - output under 1 GB."
      - name: Determine MJX9 number
        id: mjx9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_NUM=$(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName \
            -q '.[].tagName' 2>/dev/null \
            | grep -oE '^MJX9-[0-9]+$' \
            | grep -oE '[0-9]+' \
            | sort -n \
            | tail -1)
          if [ -z "$LAST_NUM" ]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_NUM + 1))
          fi
          echo "num=$NEXT_NUM" >> "$GITHUB_OUTPUT"
          echo "name=MJX9-$NEXT_NUM" >> "$GITHUB_OUTPUT"
          echo ">>> This release will be: MJX9-$NEXT_NUM"
      - name: Rename output file with MJX9 branding
        id: rename
        run: |
          SRC="${{ steps.render.outputs.output_path }}"
          DIR=$(dirname "$SRC")
          DEST="$DIR/${{ steps.mjx9.outputs.name }}.mp4"
          mv "$SRC" "$DEST"
          echo "final_path=$DEST" >> "$GITHUB_OUTPUT"
          echo ">>> Renamed $SRC -> $DEST"
      - name: Show summary
        if: always()
        run: |
          echo "## 🎧 ${{ steps.mjx9.outputs.name }} — ${{ matrix.image_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source filename:** \`${{ matrix.image_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release file:** \`${{ steps.mjx9.outputs.name }}.mp4\`" >> $GITHUB_STEP_SUMMARY
          echo "**Duration:** \`${{ steps.render.outputs.duration_seconds }} seconds\`" >> $GITHUB_STEP_SUMMARY
          echo "**Final size:** \`${{ steps.render.outputs.final_size_mb }} MB\`" >> $GITHUB_STEP_SUMMARY
      - name: Create GitHub Release with video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mjx9.outputs.name }}
          name: "${{ steps.mjx9.outputs.name }} (${{ steps.render.outputs.final_size_mb }} MB)"
          body: |
            **Release:** ${{ steps.mjx9.outputs.name }}
            **Source image:** ${{ matrix.image_name }}
            **Duration:** ${{ steps.render.outputs.duration_seconds }} seconds
            **Final size:** ${{ steps.render.outputs.final_size_mb }} MB
            **Generated by workflow run:** ${{ github.run_id }}
          files: ${{ steps.rename.outputs.final_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
